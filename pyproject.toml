[project]
name = "work-items-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-work-items"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/tj-work-items"]

[tool.uv.sources]
tj-work-items = { workspace = true }

[dependency-groups]
dev = ["mypy>=1.13,<2", "pytest>=8.4.2,<9", "ruff>=0.9,<1"]

[tool.ruff]
include = ["packages/tj-work-items/**/*.py", ".agents/tests/**/*.py"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["packages/tj-work-items/src", ".agents/tests"]

[tool.pytest.ini_options]
testpaths = [".agents/tests"]
addopts = ["-ra", "--strict-config"]
filterwarnings = ["error"]
