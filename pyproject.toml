[project]
name = "work-items-development"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.4.2,<9",
  "ruff>=0.9,<1",
  "tj-work-items",
]

[tool.uv.sources]
tj-work-items = { path = ".agents/work-items/utility/manage/runtime", editable = true }

[tool.ruff]
include = [
  ".agents/work-items/utility/manage/runtime/src/**/*.py",
  ".agents/work-items/utility/manage/scripts/runtime_bootstrap.py",
  ".agents/tests/test_azure_tracker.py",
  ".agents/tests/test_request_journal.py",
]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
".agents/work-items/utility/manage/runtime/src/tj_work_items/request_journal.py" = ["UP007", "UP045"]

[tool.mypy]
strict = true
warn_unreachable = true
files = [".agents/work-items/utility/manage/runtime/src"]

[tool.pytest.ini_options]
testpaths = [".agents/tests"]
addopts = ["-ra", "--strict-config"]
filterwarnings = ["error"]
